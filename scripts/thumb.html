<!doctype html>
<html><head><meta charset="utf-8"><title>thumbnail renderer</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>html,body{margin:0;background:transparent}model-viewer{width:480px;height:480px;background:transparent;--poster-color:transparent}</style>
</head><body>
<model-viewer camera-orbit="35deg 70deg auto" field-of-view="26deg" shadow-intensity="0.7" exposure="1.05" environment-image="neutral" interaction-prompt="none"></model-viewer>
</body></html>
